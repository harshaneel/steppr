name: Deploy simulator to GitHub Pages

# Builds web/ and publishes the dist/ as a static GitHub Pages site.
# Requires Pages to be enabled in repo settings (Source: GitHub Actions).
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "sdk/typescript/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            sdk/typescript/package-lock.json
            web/package-lock.json

      - name: Build SDK
        working-directory: sdk/typescript
        run: |
          npm ci
          npm run build

      - name: Build web app
        working-directory: web
        env:
          VITE_BASE: /steppr/
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
